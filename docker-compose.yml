services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sitio2-frontend

    ports:
      - "4004:3000"

    restart: unless-stopped

    environment:
      NODE_ENV: production

    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sitio2-backend

    restart: unless-stopped

    environment:
      NODE_ENV: production
